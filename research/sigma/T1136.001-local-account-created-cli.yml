title: Local Account Created via Command Line
id: b17e4d02-6c58-4a93-8f20-3d9a1e7c5b12
status: experimental
description: |
  Detects creation of local user accounts and their addition to the local Administrators
  group through net.exe/net1.exe, a common persistence and privilege-escalation step.
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://attack.mitre.org/techniques/T1098/
author: hunt-sage (iamjammie)
date: 2025-07-06
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1136.001
  - attack.t1098
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
  selection_create:
    CommandLine|contains|all:
      - 'user'
      - '/add'
  selection_admin:
    CommandLine|contains|all:
      - 'localgroup'
      - 'administrators'
      - '/add'
  condition: selection_img and (selection_create or selection_admin)
falsepositives:
  - Imaging, provisioning or help-desk scripts creating local accounts
level: medium
