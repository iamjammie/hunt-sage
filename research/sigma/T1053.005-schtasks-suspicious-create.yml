title: Scheduled Task Created from Suspicious Location or Interpreter
id: 6a1e4b93-8d05-4c72-9f1a-2e7b0d5c3f06
status: experimental
description: |
  Detects schtasks.exe creating tasks whose action runs from user-writable paths or uses
  script interpreters and LOLBins. Common for persistence and for remote execution
  (schtasks /create /s <host>).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: hunt-sage (iamjammie)
date: 2025-07-06
tags:
  - attack.persistence
  - attack.execution
  - attack.privilege_escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  selection_susp:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
      - 'powershell'
      - 'pwsh'
      - 'cmd.exe /c'
      - 'wscript'
      - 'cscript'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
      - 'http://'
      - 'https://'
  condition: selection_img and selection_susp
falsepositives:
  - Software installers and updaters registering tasks in ProgramData or AppData
  - Administrators deploying scripted tasks
level: medium
