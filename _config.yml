title: "Hunt-Sage"
name: "Hunt-Sage"
description: "One-stop threat hunting hub: theory, hunt playbooks, cheat sheets, labs and detection content"
url: "https://iamjammie.github.io"
baseurl: "/hunt-sage"

remote_theme: "mmistakes/minimal-mistakes"

minimal_mistakes_skin: "dark"
locale: "en-IN"
timezone: "Asia/Kolkata"

search: true
search_full_content: true
search_provider: "lunr"

author:
  name: "iamjammie"
  avatar: "/assets/images/avatar.png"
  bio: "Cybersecurity Strategist | Threat hunter | Redefining Detection"
  location: "India"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/iamjammie"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ashok-kumar-5b62819b"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:hunt-sage@gov.in"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

collections:
  ctf:
    output: true
    permalink: /ctf/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
  - scope:
      path: ""
      type: "ctf"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
    values:
      sidebar:
        nav: "main"
  - scope:
      path: "learn"
    values:
      layout: single
      toc: true
      toc_sticky: true
      sidebar:
        nav: "learn"
  - scope:
      path: "hunt"
    values:
      layout: single
      toc: true
      toc_sticky: true
      sidebar:
        nav: "hunt"
  - scope:
      path: "cheatsheets"
    values:
      layout: single
      toc: true
      toc_sticky: true
      sidebar:
        nav: "cheatsheets"
  - scope:
      path: "labs"
    values:
      layout: single
      toc: true
      toc_sticky: true
      sidebar:
        nav: "labs"
  - scope:
      path: "templates"
    values:
      layout: single
      toc: true
      sidebar:
        nav: "labs"
  - scope:
      path: "resources"
    values:
      layout: single
      toc: true
      sidebar:
        nav: "labs"
  - scope:
      path: "research"
    values:
      layout: single
      toc: true
      sidebar:
        nav: "research"

permalink: /blog/:title/

exclude:
  - scripts
  - CONTRIBUTING.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Sections below get their own sidebar nav (see _data/navigation.yml)

logo: "/assets/images/hunt-sage-banner.png"
